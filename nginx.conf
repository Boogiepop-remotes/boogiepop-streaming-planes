server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400" always;
    }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /__BASE_PATH__/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /__BASE_PATH__/remoteEntry.js {
        alias /usr/share/nginx/html/remoteEntry.js;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /__BASE_PATH__/mf-manifest.json {
        alias /usr/share/nginx/html/mf-manifest.json;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /__BASE_PATH__/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /__BASE_PATH__/ {
        alias /usr/share/nginx/html/;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/.+-[A-Za-z0-9_-]+\.(?:js|mjs|css|wasm)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:js|mjs|css|wasm|woff2)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
