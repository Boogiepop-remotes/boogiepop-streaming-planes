name: Docker → ECR → ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag ECR opcional (default = github.sha corto)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: boogiepop-streaming-planes
  ECS_CLUSTER: boogiepop-api-cluster
  ECS_SERVICE: boogiepop-api-fe-streaming-planes-svc
  VITE_BASE: /streaming-planes/
  NGINX_BASE_PATH: streaming-planes

jobs:
  build-and-deploy:
    # ARM nativo (sin QEMU) — el task Fargate es ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::653876198281:role/boogiepop-api-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$SHORT"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_BASE=${{ env.VITE_BASE }}
            NGINX_BASE_PATH=${{ env.NGINX_BASE_PATH }}
          tags: |
            ${{ steps.meta.outputs.uri }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.uri }}:latest

      - name: Deploy ECS (desired=1 + force new)
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --desired-count 1 \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
